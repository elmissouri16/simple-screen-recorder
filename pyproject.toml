[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-screen-recorder"
version = "0.1.0"
description = "Simple Linux tray screen recorder powered by ffmpeg"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "PyQt5>=5.15",
  "pynput>=1.7",
]

[project.scripts]
simple-screen-recorder = "simple_screen_recorder.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
